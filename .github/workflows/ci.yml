name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src scripts tests
      - run: python -m pytest
      - run: python scripts/repository_contracts.py --check --bundle repository-contracts-1.0.0.zip
      - uses: actions/upload-artifact@v5
        with:
          name: repository-contracts-1.0.0
          path: repository-contracts-1.0.0.zip
